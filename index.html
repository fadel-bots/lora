<style>
:root{--gold:#d6b678;--gold2:#efd9a7;--rose:#e9b9bd;--blush:#f6e4e2;--txt:#fbf6f2;--mut:rgba(251,246,242,.66);--p:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0a0b;color:var(--txt);font-family:Heebo,Manrope,system-ui,sans-serif}
html[lang=ar] body{font-family:Tajawal,Heebo,sans-serif}
body{overflow-x:hidden}body.lock{overflow:hidden}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:12px}
.serif{font-family:"Frank Ruhl Libre","Cormorant Garamond",serif}
html[lang=en] .serif{font-family:"Cormorant Garamond",serif}html[lang=ar] .serif{font-family:Tajawal,serif;font-weight:700}
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px;border-radius:30px;
background:rgba(13,10,11,.4);border:1px solid rgba(239,217,167,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);direction:ltr;opacity:0;transition:opacity 1s 1.2s}
body.started .lang{opacity:1}
.lang button{background:none;border:0;color:var(--mut);font:600 12px Manrope,Tajawal,sans-serif;padding:6px 12px;border-radius:20px;cursor:pointer}
.lang button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1213}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg img{position:absolute;left:50%;top:0;height:100%;width:auto;min-width:100%;object-fit:cover;object-position:50% 20%;
transform:translateX(-50%) scale(calc(1.12 - var(--in,0)*.12 + var(--p)*.08));
filter:blur(calc(var(--p)*8px)) brightness(calc(1 - var(--p)*.6));transition:transform 1.8s cubic-bezier(.2,.7,.1,1)}
.bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,11,.35) 0%,transparent 20%,transparent 42%,rgba(13,10,11,.88) 84%,#0d0a0b 100%),rgba(40,20,24,calc(var(--p)*.5))}
.hero{position:relative;z-index:1;height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.logo{width:min(250px,62vw);opacity:0;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.role{font:400 13px Manrope,Tajawal,sans-serif;letter-spacing:.32em;color:var(--rose);text-transform:uppercase;margin-top:14px;opacity:0}
html[lang=he] .role,html[lang=ar] .role{letter-spacing:.08em;font-size:16px;font-family:inherit}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto}
.cue{margin-top:20px;opacity:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut);letter-spacing:.15em}
.cue i{width:22px;height:36px;border:1px solid rgba(239,217,167,.5);border-radius:12px;position:relative}
.cue i:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold2);animation:wheel 1.8s infinite}
@keyframes wheel{0%{opacity:0}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.ready .logo{animation:lg 1.4s .1s cubic-bezier(.2,.8,.2,1) forwards}.ready .role{animation:fade 1s .9s forwards}.ready .rule{animation:rule 1.2s .7s forwards}.ready .cue{animation:fade 1s 1.4s forwards}
@keyframes lg{0%{opacity:0;transform:translateY(30px) scale(.92);filter:blur(8px)}100%{opacity:1;transform:none;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}}
@keyframes fade{to{opacity:1}}@keyframes rule{to{width:150px}}
main{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:10px 16px 140px}
.intro{text-align:center;margin:6px 0 24px}.intro h2{font-size:30px;font-weight:700}.intro p{color:var(--mut);font-size:15px;font-weight:300;margin-top:6px}
.btn{position:relative;display:flex;align-items:center;gap:15px;margin-bottom:12px;padding:15px;border-radius:22px;text-decoration:none;color:var(--txt);overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.13);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px -22px rgba(0,0,0,.85);transition:border-color .3s,transform .2s}
.btn:active{transform:scale(.985)}.btn:hover{border-color:rgba(239,217,167,.55)}
.btn.main{background:linear-gradient(135deg,rgba(233,185,189,.28),rgba(214,182,120,.16));border-color:rgba(233,185,189,.55)}
.ic{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1213}
.btn.main .ic{background:linear-gradient(135deg,#25d366,#128c4a);color:#fff}
.ic svg{width:26px;height:26px}
.t{flex:1}.t b{display:block;font-size:17px;font-weight:500}.t span{display:block;font-size:13px;color:var(--mut);font-weight:300;margin-top:2px}
.go{color:var(--gold2);font-size:20px}[dir=ltr] .go{transform:scaleX(-1)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.svc a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;padding:14px 10px;border-radius:20px;text-align:center;text-decoration:none;color:var(--txt);
background:linear-gradient(160deg,rgba(233,185,189,.16),rgba(255,255,255,.03));border:1px solid rgba(233,185,189,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:15px;font-weight:500;line-height:1.3;transition:border-color .3s,transform .2s}
.svc a:active{transform:scale(.97)}.svc a:hover{border-color:var(--rose)}.svc a i{font-style:normal;font-size:26px}
.sub2{text-align:center;color:var(--mut);font-size:13px;margin:-4px 0 12px}
.sec{margin:38px 0 16px;text-align:center}.sec h3{font-size:26px;font-weight:700}.sec p{color:var(--mut);font-size:14px;font-weight:300;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;transition:border-color .3s}
.prod.sel{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.prod img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#f4eee6}
.pi{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pi b{font-size:14.5px;font-weight:500;line-height:1.3}.pi small{font-size:12px;color:var(--mut);line-height:1.4}
.pi .pr{font-size:13px;color:var(--gold2);margin-top:auto}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.qty button{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid rgba(239,217,167,.5);background:none;color:var(--gold2);font-size:18px;cursor:pointer}
.qty .addb{flex:1;border-radius:18px;font:500 14px inherit;font-family:inherit;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1213;border:0}
.qty output{font-size:16px;min-width:20px;text-align:center}
.cart{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:7;width:min(468px,calc(100% - 32px));
display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:22px;background:#151012;border:1px solid var(--rose);box-shadow:0 20px 50px rgba(0,0,0,.7);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cart.show{transform:translate(-50%,0)}
.cart .n{font-size:14px;color:var(--mut);flex:1}.cart .n b{color:var(--txt);font-size:18px}
.cart a{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;text-decoration:none;font-weight:500;font-size:15px}
.cart a svg{width:20px;height:20px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:30px;padding:15px;border-radius:18px;text-decoration:none;border:1px solid rgba(239,217,167,.5);color:var(--gold2);font-size:16px}
.save svg{width:20px;height:20px}
footer{text-align:center;color:rgba(251,246,242,.35);font:400 11px Manrope,sans-serif;letter-spacing:.3em;margin-top:30px}
footer button{display:block;margin:10px auto 0;background:none;border:0;color:rgba(251,246,242,.5);font:400 12px Heebo,Tajawal,sans-serif;text-decoration:underline;cursor:pointer;letter-spacing:0}
.a11y-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:6;width:46px;height:46px;border-radius:50%;border:1px solid rgba(239,217,167,.5);background:rgba(13,10,11,.6);backdrop-filter:blur(10px);color:var(--gold2);display:grid;place-items:center;cursor:pointer;transition:bottom .4s}
body.hascart .a11y-btn{bottom:calc(96px + env(safe-area-inset-bottom))}
.a11y-btn svg{width:24px;height:24px}
.a11y-panel{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:8;width:230px;padding:10px;border-radius:18px;background:#151012;border:1px solid rgba(239,217,167,.35);display:none;box-shadow:0 20px 50px rgba(0,0,0,.7)}
body.hascart .a11y-panel{bottom:calc(152px + env(safe-area-inset-bottom))}
.a11y-panel.open{display:block}
.a11y-panel button{display:block;width:100%;text-align:start;padding:12px;margin:2px 0;border-radius:10px;border:0;background:none;color:var(--txt);font:400 15px Heebo,Tajawal,sans-serif;cursor:pointer}
.a11y-panel button[aria-pressed=true]{background:rgba(214,182,120,.25);color:var(--gold2)}
html.big{font-size:118%}html.big .t b{font-size:20px}html.big .pi b{font-size:17px}
html.hc{--mut:#fff}html.hc .btn,html.hc .prod{background:#000!important;border-color:#fff!important}html.hc .bg{filter:brightness(.3)}
html.still *,html.still *:before,html.still *:after{animation:none!important;transition:none!important}html.still .logo,html.still .role,html.still .cue,html.still .lang{opacity:1!important;transform:none!important}html.still .rule{width:150px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none;place-items:center;padding:16px}.modal.open{display:grid}
.modal div{max-width:440px;background:#151012;border:1px solid rgba(239,217,167,.35);border-radius:20px;padding:24px;line-height:1.7;font-size:15px}
.modal h2{font-size:22px;margin-bottom:10px;color:var(--gold2)}.modal p{margin-bottom:10px}.modal a{color:var(--gold2)}
.modal button{margin-top:8px;padding:10px 22px;border-radius:12px;border:0;background:var(--gold);color:#111;font:500 15px Heebo,Tajawal,sans-serif;cursor:pointer}
#intro{position:fixed;inset:0;z-index:10;background:#0d0a0b;display:grid;place-items:center;transition:opacity 1s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro img{position:relative;width:min(200px,50vw);opacity:0;animation:mono 2.6s .3s forwards}
@keyframes mono{0%{opacity:0;transform:scale(.7);filter:blur(10px)}35%{opacity:1;transform:scale(1);filter:none}75%{opacity:1}100%{opacity:0;transform:scale(2.6);filter:blur(8px)}}
#intro.out{opacity:0;pointer-events:none}
#skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.45);background:none;border:0;font-family:inherit}
@media (prefers-reduced-motion:reduce){#intro{display:none}.logo,.role,.cue,.lang{opacity:1!important;transform:none!important}.rule{width:150px}}

const root=document.documentElement,body=document.body,hero=document.getElementById('hero'),intro=document.getElementById('intro');
let L='he',cart={};
const wa=t=>'https://wa.me/'+PH+'?text='+encodeURIComponent(t);
function render(){const d=T[L];const g=document.getElementById('grid');g.innerHTML='';
 P.forEach(p=>{const q=cart[p.id]||0,el=document.createElement('div');el.className='prod'+(q?' sel':'');
  el.innerHTML=`<img src="${p.src}" alt="${p[L]}"><div class="pi"><b>${p[L]}</b><small>${p['d'+L]||''}</small><span class="pr">${p.price?('₪'+p.price):d.price_ask} · ${p.size||''}</span>
  <div class="qty">${q?`<button aria-label="-" data-a="-">−</button><output>${q}</output><button aria-label="+" data-a="+">+</button>`:`<button class="addb" data-a="+">${d.add} +</button>`}</div></div>`;
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{cart[p.id]=Math.max(0,(cart[p.id]||0)+(b.dataset.a==='+'?1:-1));if(!cart[p.id])delete cart[p.id];render()});
  g.appendChild(el)});
 const n=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cn').textContent=n;
 document.getElementById('cart').classList.toggle('show',n>0);body.classList.toggle('hascart',n>0);
 const lines=P.filter(p=>cart[p.id]).map(p=>`• ${p[L]}${p.size?' ('+p.size+')':''} × ${cart[p.id]}`);
 document.getElementById('send').href=wa(d.wa_order+'\n'+lines.join('\n')+'\n\n'+d.wa_end);}
function setLang(l){L=T[l]?l:'he';const d=T[L];root.lang=L;root.dir=d.dir;
 document.querySelectorAll('[data-k]').forEach(e=>{if(d[e.dataset.k]!=null)e.textContent=d[e.dataset.k]});
 const IC=['✨','⚡','💄','🔥'];document.getElementById('svc').innerHTML=d.svc_list.map((x,i)=>`<a href="${wa(d.wa_svc.replace('{x}',x))}" target="_blank" rel="noopener" data-goatcounter-click="lora-svc-${i}"><i aria-hidden="true">${IC[i]}</i>${x}</a>`).join('');
 document.getElementById('bookBtn').href=wa(d.wa_book);document.getElementById('a11yBtn').setAttribute('aria-label',d.a11y);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));render();
 try{localStorage.setItem('lora-lang',L)}catch(e){}}
let l0='';try{l0=localStorage.getItem('lora-lang')||''}catch(e){}
if(!T[l0]){const n=(navigator.language||'he').slice(0,2);l0=n==='ar'?'ar':n==='he'?'he':'en'}
setLang(l0);document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
addEventListener('scroll',()=>root.style.setProperty('--p',Math.min(1,scrollY/(innerHeight*.75)).toFixed(3)),{passive:true});
const ab=document.getElementById('a11yBtn'),ap=document.getElementById('a11yPanel'),md=document.getElementById('stmt');
ab.onclick=()=>{const o=ap.classList.toggle('open');ab.setAttribute('aria-expanded',o)};
let pref={};try{pref=JSON.parse(localStorage.getItem('lora-a11y')||'{}')}catch(e){}
ap.querySelectorAll('[data-t]').forEach(b=>{const k=b.dataset.t,s=v=>{root.classList.toggle(k,v);b.setAttribute('aria-pressed',v)};s(!!pref[k]);
 b.onclick=()=>{pref[k]=!pref[k];s(pref[k]);if(k==='still')finish();try{localStorage.setItem('lora-a11y',JSON.stringify(pref))}catch(e){}}});
const openSt=()=>{md.classList.add('open');ap.classList.remove('open');document.getElementById('stClose').focus()},closeSt=()=>md.classList.remove('open');
document.getElementById('stmtBtn').onclick=openSt;document.getElementById('stmtLink').onclick=openSt;document.getElementById('stClose').onclick=closeSt;
md.onclick=e=>{if(e.target===md)closeSt()};addEventListener('keydown',e=>{if(e.key==='Escape'){closeSt();ap.classList.remove('open')}});
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}rs();addEventListener('resize',rs);
const N=800,pts=[];for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=i*2.39996;pts.push([Math.cos(t)*r,y,Math.sin(t)*r,Math.random(),Math.random()<.35])}
let t0=performance.now(),done=false;
function frame(now){if(done)return;const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
 const R=Math.min(W,H)*.32*(t<1.9?Math.min(1,t/1.1)**.5:1+Math.pow((t-1.9)*2.2,3));
 const a=t*.8,b=.4+Math.sin(t*.6)*.15,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),f=Math.min(W,H)*1.1;
 for(const p of pts){let x=p[0]*ca-p[2]*sa,z=p[0]*sa+p[2]*ca,y=p[1]*cb-z*sb;z=p[1]*sb+z*cb;x*=R;y*=R;z=z*R+f*1.1;if(z<10)continue;
  const k=f/z,al=Math.min(1,(k-.55)*1.6)*(.5+p[3]*.5)*(t>2.4?Math.max(0,1-(t-2.4)/.5):1);if(al<=0)continue;
  ctx.fillStyle=p[4]?`rgba(233,185,189,${al})`:`rgba(239,217,167,${al})`;ctx.beginPath();ctx.arc(W/2+x*k,H/2+y*k,Math.max(.4,1.8*k)*D,0,6.283);ctx.fill()}
 if(t>2.9)finish();else requestAnimationFrame(frame)}
function finish(){if(done)return;done=true;intro.classList.add('out');body.classList.remove('lock');body.classList.add('started');root.style.setProperty('--in',1);hero.classList.add('ready');setTimeout(()=>intro.remove(),1100)}
if(matchMedia('(prefers-reduced-motion:reduce)').matches||pref.still)finish();else requestAnimationFrame(frame);
document.getElementById('skip').onclick=finish;intro.addEventListener('click',finish);
})();
