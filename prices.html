<style>
:root{--gold:#c9a45c;--rose:#e9b9bd;--bg:#faf6f2;--card:#fff;--txt:#2a2023;--mut:#8a7b74}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;padding:20px 16px 120px}
main{max-width:520px;margin:0 auto}
h1{font-size:24px;text-align:center}.sub{text-align:center;color:var(--mut);font-size:14px;margin:6px 0 20px;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px -12px rgba(80,50,40,.35);border:1px solid #f0e6e0}
.row img{width:64px;height:76px;object-fit:cover;border-radius:12px;background:#f4eee8;flex:0 0 64px}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;line-height:1.3}.t em{display:block;font:500 italic 14px "Cormorant Garamond",serif;color:#9a7a3a;direction:ltr;text-align:right}.t small{color:var(--mut);font-size:12px}
.pr{flex:0 0 96px;position:relative}.pr input{width:100%;height:46px;border-radius:12px;border:1.5px solid #e4d6cc;padding:0 30px 0 10px;font:600 18px Heebo,sans-serif;text-align:center;background:#fffdfb;color:var(--txt)}
.pr input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.2)}
.pr span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px;pointer-events:none}
.row.done{border-color:var(--gold)}
textarea{width:100%;margin-top:14px;border-radius:14px;border:1.5px solid #e4d6cc;padding:12px;font:15px Heebo,sans-serif;min-height:80px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(250,246,242,.95);backdrop-filter:blur(10px);border-top:1px solid #eadfd8}
.bar div{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar small{flex:1;color:var(--mut);font-size:13px}
.bar a{display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;text-decoration:none;font-weight:600}
